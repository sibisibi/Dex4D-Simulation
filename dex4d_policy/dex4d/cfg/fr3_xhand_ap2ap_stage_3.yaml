graphics_device_id: 0
env:
  env_name: "fr3_xhand_ap2ap"
  numEnvs: 4096
  envSpacing: 1.5
  episodeLength: 400 # 250
  enableDebugVis: False
  aggregateMode: 1
  contextLength: 4

  random_prior: True
  random_time: True
  repose_z: True
  goal_cond: False

  too_far_reset_threshold: 0.3

  object_init_stable_ratio: 0.2
  goal_reset_stable_ratio: 0.1

  # arm_action_clip: 1.0
  # hand_action_clip: 1.0

  delta_x_range: [-0.1, 0.1]
  delta_y_range: [-0.1, 0.1]

  numKeypoints: 128
  kpDownsampleRatio: 2

  robot_default_dof_pos: [
    # 0.0000,  0.2000,  0.0000, -2.2000,  0.0000,  2.1000, -0.7850,  # FR3 (palm over table center, facing down)
    0.0000, -0.3740,  0.0000, -2.5060,  0.0000,  1.8480, -0.7850,  # FR3, ALLCAT (palm at stock ALLCAT point, facing down)
    0.0000,  0.0000,  0.0000,  0.0000,  0.0000,  0.0000,  0.0000,  0.0000,  0.0000,  0.0000,  0.0000,  0.0000 # XHand (open)
  ]

  # object_code_dict: {
  #   'sem/Mug-10f6e09036350e92b3f21f1137c3c347':[0.06],
  # }
  object_code_dict_file: "cfg/train_set.yaml"
  # object_cls_list: ['bottle']
  object_cls_list: null # use all classes, ALLCAT
  object_cls_exclude_list: null
  object_num: null

  stiffnessScale: 1.0
  forceLimitScale: 1.0
  useRelativeControl: False
  useOSCControl: False
  dofSpeedScale: 10.0
  actionsMovingAverage: 1.0
  # controlFrequencyInv: 2 # 30 Hz
  controlFrequencyInv: 12 # 5 Hz, ALLCAT

  startPositionNoise: 0.0
  startRotationNoise: 0.0

  resetPositionNoise: 0.0
  resetRotationNoise: 0.0
  resetDofPosRandomInterval: 0.0
  resetDofVelRandomInterval: 0.0

  distRewardScale: 20
  transition_scale: 0.1
  orientation_scale: 0.1
  rotRewardScale: 1.0
  rotEps: 0.1
  actionPenaltyScale: -0.0002
  reachGoalBonus: 250
  fallDistance: 0.4
  fallPenalty: 0.0

  objectType: "pot" 
  observationType: "full_state"
  handAgentIndex: "[[0, 1, 2, 3, 4, 5, 6]]"
  asymmetric_observations: False # If False, both Actor and Critic get full state
  successTolerance: 0.1
  printNumSuccesses: False
  maxConsecutiveSuccesses: 0

  asset:
    assetRoot: "../assets"
    assetFileName: "urdf/fr3_xhand_description/fr3_xhand_dex4d.urdf"
    # assetFileNameBlock: "urdf/objects/cube_multicolor.urdf"
    # assetFileNameBall: "urdf/objects/ball.urdf"
    # assetFileNameEgg: "mjcf/open_ai_assets/hand/egg.xml"
    # assetFileNamePen: "mjcf/open_ai_assets/hand/pen.xml"

reward_scales:
  # obj_finger: 1.0
  # obj_hand: 1.0
  obj_finger: 0 # ALLCAT
  obj_hand: 0 # ALLCAT
  goal_obj: 1.0
  success_bonus: 1.0
  terminal_bonus: 1.0
  # finger_curl_reg: 1.0
  finger_curl_reg: 10.0 # ALLCAT
  table_collision_penalty: 1.0
  fall_penalty: 0
  hand_vel_penalty: 0
  dof_vel: 0
  dof_acc: 0
  # action_penalty: 1.0
  action_penalty: 5.0 # ALLCAT

task:
  randomize: True
  curriculum: True
  push_objects: True
  push_interval_s: 4.0
  max_push_linvel_xy: 0.2
  max_push_angvel: 0.2
  randomization_params:
    frequency: 720   # Define how many simulation steps between generating new randomizations
    observations:
      range: [ 0, .002 ] # range for the white noise
      range_correlated: [ 0, .001 ] # range for correlated noise, refreshed with freq `frequency`
      operation: "additive"
      distribution: "gaussian"
      schedule: "linear"   # "constant" is to turn on noise after `schedule_steps` num steps
      schedule_steps: 40000
    actions:
      range: [ 0., .05 ]
      range_correlated: [ 0, .015 ] # range for correlated noise, refreshed with freq `frequency`
      operation: "additive"
      distribution: "gaussian"
      schedule: "linear"  # "linear" will linearly interpolate between no rand and max rand
      schedule_steps: 40000
    sim_params:
      gravity:
        range: [ 0, 0.4 ]
        operation: "additive"
        distribution: "gaussian"
        schedule: "linear"  # "linear" will linearly interpolate between no rand and max rand
        schedule_steps: 40000
    actor_params:
      robot:
        # color: False
        dof_properties:
          damping:
            range: [ 0.9, 1.1 ]
            # range: [ 0.3, 3.0 ]
            operation: "scaling"
            distribution: "uniform"
            # distribution: "loguniform"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: 30000
          stiffness:
            range: [ 0.9, 1.1 ]
            # range: [ 0.75, 1.5 ]
            operation: "scaling"
            distribution: "uniform"
            # distribution: "loguniform"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: 30000
          lower:
            range: [ 0, 0.01 ]
            operation: "additive"
            distribution: "gaussian"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: 30000
          upper:
            range: [ 0, 0.01 ]
            operation: "additive"
            distribution: "gaussian"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: 30000
        rigid_body_properties:
          mass:
            range: [ 0.5, 1.5 ]
            operation: "scaling"
            distribution: "uniform"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: 30000
        rigid_shape_properties:
          friction:
            num_buckets: 250
            range: [ 0.7, 1.3 ]
            operation: "scaling"
            distribution: "uniform"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: 30000
      object:
        # scale:
        #   range: [ 0.95, 1.05 ]
        #   operation: "scaling"
        #   distribution: "uniform"
        #   schedule: "linear"  # "linear" will scale the current random sample by ``min(current num steps, schedule_steps) / schedule_steps`
        #   schedule_steps: 30000
        rigid_body_properties:
          mass:
            range: [ 0.5, 1.5 ]
            operation: "scaling"
            distribution: "uniform"
            schedule: "linear"  # "linear" will scale the current random sample by ``min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: 30000
        rigid_shape_properties:
          friction:
            num_buckets: 250
            range: [ 0.7, 1.3 ]
            operation: "scaling"
            distribution: "uniform"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: 30000
      # table:
      #   rigid_shape_properties:
      #     friction:
      #       num_buckets: 250
      #       range: [ 0.5, 1.2 ]
      #       operation: "scaling"
      #       distribution: "uniform"
      #       schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
      #       schedule_steps: 30000

sim:
  substeps: 2
  physx:
    num_threads: 4
    solver_type: 1  # 0: pgs, 1: tgs
    num_position_iterations: 8 # 8 bottle
    num_velocity_iterations: 0
    contact_offset: 0.002
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 1000.0
    default_buffer_size_multiplier: 5.0
  flex:
    num_outer_iterations: 5
    num_inner_iterations: 20
    warm_start: 0.8
    relaxation: 0.75
